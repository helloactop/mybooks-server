name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:public
      - run: npm run check:icons
      - run: npm test
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: toolbox-runtime/requirements.txt
      - run: pip install -r toolbox-runtime/requirements.txt
      - name: toolbox-runtime unit tests
        working-directory: toolbox-runtime
        run: python -m unittest discover -s tests -v
