<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>插件中心 · My books</title>
  <link rel="icon" type="image/png" href="/logo.png?v=2">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="My books">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/css/style.css?v=122">
  <link rel="stylesheet" href="/css/toolbox.css?v=4">
  <link rel="stylesheet" href="/css/plugins.css?v=2">
</head>
<body data-page="plugins">
  <main class="tb-page pc-page">
    <header class="tb-hero">
      <div>
        <p class="tb-eyebrow">PLUGIN CENTER</p>
        <h1 class="tb-title">插件中心</h1>
        <p class="tb-lede">安装、授权、运行与排障都在这里。插件代码仍由独立的 Python 运行时执行，安装与启停继续走原有 Toolbox 通道。</p>
      </div>
      <div class="tb-runtime-box">
        <div class="tb-runtime" id="pcRuntime" role="status" aria-live="polite">
          <span class="tb-runtime-dot" aria-hidden="true"></span>
          <span id="pcRuntimeText">正在检测插件运行时…</span>
        </div>
        <button type="button" class="btn btn-ghost btn-sm" id="pcRestartRuntime">重启插件运行时</button>
      </div>
    </header>

    <nav class="tb-tabs pc-tabs" role="tablist" aria-label="插件中心分区">
      <button type="button" role="tab" id="pcTabOverview" data-tab="overview" aria-selected="true" aria-controls="pcPanelOverview">总览</button>
      <button type="button" role="tab" id="pcTabStore" data-tab="store" aria-selected="false" aria-controls="pcPanelStore">商店</button>
      <button type="button" role="tab" id="pcTabInstalled" data-tab="installed" aria-selected="false" aria-controls="pcPanelInstalled">已安装 <span class="tb-count" id="pcInstalledCount"></span></button>
      <button type="button" role="tab" id="pcTabTasks" data-tab="tasks" aria-selected="false" aria-controls="pcPanelTasks">任务 <span class="tb-count" id="pcTaskCount"></span></button>
      <button type="button" role="tab" id="pcTabSettings" data-tab="settings" aria-selected="false" aria-controls="pcPanelSettings">设置</button>
    </nav>

    <!-- 总览 -->
    <section class="tb-panel" id="pcPanelOverview" role="tabpanel" aria-labelledby="pcTabOverview" aria-busy="true">
      <div class="pc-metrics" id="pcMetrics"></div>
      <div class="tb-note hidden" id="pcOverviewNote" role="status"></div>

      <div class="pc-columns">
        <section class="pc-block" aria-labelledby="pcRuntimeHead">
          <div class="pc-block-head">
            <h2 id="pcRuntimeHead">Runtime 状态</h2>
          </div>
          <dl class="pc-kv" id="pcRuntimeBody"></dl>
        </section>
        <section class="pc-block" aria-labelledby="pcSecurityHead">
          <div class="pc-block-head">
            <h2 id="pcSecurityHead">安全状态</h2>
          </div>
          <dl class="pc-kv" id="pcSecurityBody"></dl>
        </section>
      </div>

      <section class="pc-block" aria-labelledby="pcErrorsHead">
        <div class="pc-block-head">
          <h2 id="pcErrorsHead">最近错误</h2>
          <span class="tb-muted">最多 5 条，点击进入插件日志</span>
        </div>
        <div class="pc-list" id="pcRecentErrors"></div>
      </section>
    </section>

    <!-- 商店 -->
    <section class="tb-panel hidden" id="pcPanelStore" role="tabpanel" aria-labelledby="pcTabStore" aria-busy="false">
      <div class="pc-toolbar">
        <label class="pc-search">
          <span class="pc-search-label">搜索</span>
          <input type="search" id="pcStoreSearch" placeholder="插件名称、作者或简介" aria-label="搜索插件" autocomplete="off">
        </label>
        <label class="pc-select">
          <span>排序</span>
          <select id="pcStoreSort" class="tb-select">
            <option value="name">名称</option>
            <option value="updated">最近发布</option>
            <option value="installed">已安装优先</option>
          </select>
        </label>
        <button type="button" class="btn btn-ghost btn-sm" id="pcStoreRefresh">刷新商店</button>
      </div>
      <p class="tb-muted" id="pcStoreMeta">正在获取工具商店…</p>
      <div class="tb-note" id="pcStoreNote" role="status" hidden></div>
      <div class="pc-store-grid" id="pcStoreList"></div>
      <div class="tb-empty hidden" id="pcStoreEmpty">商店暂时没有可用插件。</div>
    </section>

    <!-- 已安装 -->
    <section class="tb-panel hidden" id="pcPanelInstalled" role="tabpanel" aria-labelledby="pcTabInstalled" aria-busy="false">
      <div class="pc-toolbar">
        <div class="pc-chips" role="group" aria-label="筛选已安装插件">
          <button type="button" class="pc-chip is-active" data-filter="all" aria-pressed="true">全部</button>
          <button type="button" class="pc-chip" data-filter="enabled" aria-pressed="false">已启用</button>
          <button type="button" class="pc-chip" data-filter="disabled" aria-pressed="false">已停用</button>
          <button type="button" class="pc-chip" data-filter="update" aria-pressed="false">可更新</button>
          <button type="button" class="pc-chip" data-filter="error" aria-pressed="false">异常</button>
        </div>
        <button type="button" class="btn btn-ghost btn-sm" id="pcInstalledRefresh">刷新</button>
      </div>
      <p class="tb-muted">停用会立即阻断插件接口；卸载默认保留插件私有数据。</p>
      <div class="tb-note" id="pcInstalledNote" role="status" hidden></div>
      <div class="tb-list" id="pcInstalledList"></div>
      <div class="tb-empty hidden" id="pcInstalledEmpty">还没有安装插件。</div>
    </section>

    <!-- 任务 -->
    <section class="tb-panel hidden" id="pcPanelTasks" role="tabpanel" aria-labelledby="pcTabTasks" aria-busy="false">
      <div class="pc-toolbar">
        <label class="pc-select">
          <span>插件</span>
          <select id="pcTaskPlugin" class="tb-select"><option value="">全部插件</option></select>
        </label>
        <label class="pc-select">
          <span>状态</span>
          <select id="pcTaskStatus" class="tb-select">
            <option value="">全部状态</option>
            <option value="running">运行中</option>
            <option value="completed">已完成</option>
            <option value="failed">失败</option>
            <option value="cancelled">已取消</option>
          </select>
        </label>
        <button type="button" class="btn btn-ghost btn-sm" id="pcTaskRefresh">刷新</button>
      </div>
      <p class="tb-muted">任务进度由插件自己回报；运行中的任务会在页面可见时自动刷新。</p>
      <div class="tb-note" id="pcTaskNote" role="status" hidden></div>
      <div class="tb-list" id="pcTaskList"></div>
      <div class="tb-empty hidden" id="pcTaskEmpty">还没有任务记录。</div>
      <div class="pc-pager" id="pcTaskPager">
        <button type="button" class="btn btn-ghost btn-sm" id="pcTaskPrev">上一页</button>
        <span class="tb-muted" id="pcTaskPageInfo">—</span>
        <button type="button" class="btn btn-ghost btn-sm" id="pcTaskNext">下一页</button>
      </div>
    </section>

    <!-- 设置 -->
    <section class="tb-panel hidden" id="pcPanelSettings" role="tabpanel" aria-labelledby="pcTabSettings" aria-busy="false">
      <div class="pc-block-head">
        <h2>部署安全信息</h2>
        <button type="button" class="btn btn-ghost btn-sm" id="pcCopyAdvice">复制部署建议</button>
      </div>
      <p class="tb-muted">这里只展示当前部署的只读状态。修改环境变量需要重启服务，本页面不会也不应该替你改配置。</p>
      <dl class="pc-kv" id="pcSettingsBody"></dl>
      <div class="tb-note" id="pcSettingsNote" role="status" hidden></div>
    </section>
  </main>

  <!-- 任务详情 -->
  <div id="pcTaskModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="pcTaskModalTitle">
    <div class="modal-box pc-modal-box">
      <div class="modal-head">
        <h2 id="pcTaskModalTitle">任务详情</h2>
        <button type="button" class="icon-btn" data-close aria-label="关闭">×</button>
      </div>
      <div class="pc-task-body" id="pcTaskModalBody"></div>
      <div class="form-foot">
        <div class="form-foot-btns">
          <button type="button" class="btn btn-ghost" data-close>关闭</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/icon.js?v=2"></script>
  <script src="/js/chrome.js?v=42"></script>
  <script src="/js/base.js?v=1"></script>
  <script src="/js/api.js?v=1"></script>
  <script src="/js/modal.js?v=1"></script>
  <script src="/js/overlay.js?v=4"></script>
  <script src="/js/plugin-center.js?v=3"></script>
  <script src="/js/page-plugins.js?v=1"></script>
</body>
</html>
