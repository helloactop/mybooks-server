services:
  my-books:
    build: .
    ports:
      - "127.0.0.1:${MYBOOKS_PORT:-3000}:3000"
    environment:
      MYBOOKS_PUBLIC_READ: "${MYBOOKS_PUBLIC_READ:-false}"
      MYBOOKS_PUBLIC_URL: "${MYBOOKS_PUBLIC_URL:-http://localhost:3000}"
      MYBOOKS_TOOLBOX_DIR: /toolbox
      MYBOOKS_TOOLBOX_RUNTIME_URL: "http://toolbox-runtime:8765"
      MYBOOKS_TOOLBOX_ALLOW_UNREVIEWED: "${MYBOOKS_TOOLBOX_ALLOW_UNREVIEWED:-false}"
      MYBOOKS_TOOLBOX_ALLOW_PRIVATE_STORE: "${MYBOOKS_TOOLBOX_ALLOW_PRIVATE_STORE:-false}"
      # 启用 TOOLBOX_ISOLATE_PLUGINS=1 时建议设为 false：子进程必须带每插件身份令牌。
      MYBOOKS_TOOLBOX_LEGACY_COMPAT: "${MYBOOKS_TOOLBOX_LEGACY_COMPAT:-true}"
      # 仅供自动化/临时验收；正常部署请用 npm run setup 创建设备会话。
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
    volumes:
      - mybooks-data:/data
      - toolbox-data:/toolbox
    depends_on:
      toolbox-runtime:
        condition: service_healthy
    restart: unless-stopped

  toolbox-runtime:
    build: ./toolbox-runtime
    environment:
      MYBOOKS_TOOLBOX_DIR: /toolbox
      MYBOOKS_NODE_INTERNAL_URL: "http://my-books:3000"
      MYBOOKS_AUDIO_DIR: "/toolbox/data/audio"
      TOOLBOX_RUNTIME_HOST: "0.0.0.0"
      TOOLBOX_RUNTIME_PORT: "8765"
      # 容器内每插件子进程（故障/资源隔离，非恶意代码沙箱）；默认关闭保持旧行为。
      TOOLBOX_ISOLATE_PLUGINS: "${TOOLBOX_ISOLATE_PLUGINS:-0}"
      TOOLBOX_MAX_CHILDREN: "${TOOLBOX_MAX_CHILDREN:-2}"
      TOOLBOX_CHILD_MEMORY_MB: "${TOOLBOX_CHILD_MEMORY_MB:-384}"
    volumes:
      - toolbox-data:/toolbox
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mybooks-data:
  toolbox-data:
