<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>工具 · My books</title>
  <link rel="icon" type="image/png" href="/logo.png?v=2">
  <link rel="stylesheet" href="/css/style.css?v=122">
  <link rel="stylesheet" href="/css/toolbox.css?v=4">
</head>
<body class="tb-tool-body" data-page="toolbox-tool">
  <header class="tb-tool-head">
    <a class="tb-back" href="/toolbox" aria-label="返回工具箱">
      <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="/vendor/lucide-sprite.svg?v=1#arrow-left"></use></svg>
      <span>工具箱</span>
    </a>
    <div class="tb-tool-id">
      <img id="tbToolIcon" class="tb-tool-icon" alt="" hidden>
      <div class="tb-tool-name">
        <strong id="tbToolName">插件</strong>
        <span id="tbToolMeta" class="tb-tool-meta"></span>
      </div>
    </div>
    <div class="tb-tool-actions">
      <div class="tb-more-wrap">
        <button type="button" class="tb-more-btn" id="tbMore" aria-label="插件选项" aria-expanded="false" aria-controls="tbMoreMenu">⋯</button>
        <div class="tb-more-menu" id="tbMoreMenu" hidden>
          <label class="tb-more-row" for="tbLocale">
            <span>语言</span>
            <select id="tbLocale" class="tb-select" aria-label="插件语言">
              <option value="zh">中文</option>
              <option value="zh-TW">繁體中文</option>
              <option value="en">English</option>
            </select>
          </label>
          <label class="tb-more-row" for="tbTheme">
            <span>主题</span>
            <select id="tbTheme" class="tb-select" aria-label="插件主题">
              <option value="light">浅色</option>
              <option value="dark">深色</option>
            </select>
          </label>
          <button type="button" class="tb-more-action" id="tbReload">重新加载插件</button>
          <a class="tb-more-action" href="/toolbox#tasks">任务中心</a>
        </div>
      </div>
    </div>
  </header>

  <main class="tb-tool-stage">
    <div class="tb-tool-state" id="tbToolState" role="status" aria-live="polite">正在加载插件…</div>
    <iframe id="tbFrame" class="tb-frame" title="插件界面" sandbox="allow-scripts allow-modals allow-downloads" referrerpolicy="no-referrer" hidden></iframe>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="/js/page-toolbox-tool.js?v=5"></script>
</body>
</html>
